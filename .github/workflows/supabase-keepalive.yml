# Keeps the free Supabase project from pausing after 7 days without activity (ADR-009).
# Runs a one-row read through the REST API with the secret key. Needs two repository secrets:
# SUPABASE_URL and SUPABASE_SECRET_KEY (Settings > Secrets and variables > Actions).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 14 */3 * *' # every 3 days at 14:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one row from contact_messages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            "$SUPABASE_URL/rest/v1/contact_messages?select=id&limit=1" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY"
